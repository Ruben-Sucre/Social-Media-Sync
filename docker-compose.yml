services:

  n8n:
    build:
      context: .
      dockerfile: Dockerfile.n8n
    image: social-media-sync-n8n:latest
    container_name: social-media-sync-n8n
    ports:
      - "5678:5678"
    volumes:
      - ./scripts:/workspace/social-media-sync/scripts
      - ./videos:/workspace/social-media-sync/videos
      - ./data:/workspace/social-media-sync/data
      - ./logs:/workspace/social-media-sync/logs
      - ./n8n:/home/node/.n8n
    environment:
      - N8N_BASIC_AUTH_ACTIVE=false
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_EDITOR_BASE_URL=http://localhost:5678
      - N8N_PUBLIC_API_DISABLED=false
      - N8N_LOG_LEVEL=debug
      - NODE_ENV=production
      - N8N_EXECUTIONS_PROCESS=main
      - PYTHONPATH=/workspace/social-media-sync
      # TikTok scraping configuration
      - TIKTOK_TIMEOUT=45000
      - TIKTOK_SCROLL_ATTEMPTS=3
      - TIKTOK_SCROLL_WAIT_MIN=2
      - TIKTOK_SCROLL_WAIT_MAX=5
    restart: unless-stopped

volumes:
  n8n_data:
    driver: local
    name: social-media-sync-n8n-data

networks:
  n8n-network:
    driver: bridge
    name: social-media-sync-network
